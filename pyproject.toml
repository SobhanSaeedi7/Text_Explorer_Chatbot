[project]
name = "pelekan-rag-chat"
version = "0.1.0"
description = "Pelekan RAG Chat - local educational RAG chatbot (setup skeleton stage)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32",
    "python-dotenv>=1.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pelekan_rag_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
